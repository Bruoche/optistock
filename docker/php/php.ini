; Production PHP settings for the runtime image (R7).
expose_php = Off
memory_limit = 512M
; Long-running optimization jobs run on the queue worker (its own --timeout governs);
; HTTP requests stay bounded.
max_execution_time = 120
upload_max_filesize = 16M
post_max_size = 16M
; Errors go to stderr so Docker captures them (D5); nothing rendered to clients.
display_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = UTC
