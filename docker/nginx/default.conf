# Single same-origin ingress (D3/R4): static assets, PHP via FastCGI to `backend`,
# and the Reverb websocket via /app to `websocket`. No per-environment host is
# baked anywhere — the browser connects same-origin (echo.ts F1 fallback).
server {
    listen 80 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 16m;

    # SPA/PHP fallback: real files first, then the Laravel front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Reverb websocket endpoint. The Echo client connects same-origin to /app/{key};
    # proxy it to the websocket service with the WS upgrade dance (R4).
    location /app {
        proxy_pass http://websocket:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-lived sockets: don't cut them on idle.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # PHP -> FastCGI on the `backend` (php-fpm) container. SCRIPT_FILENAME is the path
    # INSIDE that container, not nginx's filesystem.
    location ~ \.php$ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Allow long synchronous requests (route tracing) without a premature 504.
        fastcgi_read_timeout 120s;
    }

    # Don't leak dotfiles.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
