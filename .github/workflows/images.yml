name: images

# Regression guard: the deployment images must stay buildable (pinned bases,
# lockfile-first layering). Builds each PHP target + the nginx front image on PRs.
# No push to a registry — this only proves the Dockerfiles build.

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  php-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [fpm, queue, reverb, init]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  nginx-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build nginx (web) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/nginx/Dockerfile
          push: false
          load: false
          # Public client key only — never a secret (CR-2).
          build-args: |
            VITE_REVERB_APP_KEY=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
